name: ZYVORA ULTRA X CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Build web application
        run: pnpm --filter @zyvora/web build
      - name: Check realtime service types
        run: pnpm --filter @zyvora/realtime check
      - name: Build API service
        run: pnpm --filter @zyvora/api build
